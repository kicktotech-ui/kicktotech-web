services:
  - type: web
    name: kicktotech-web
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_BACKEND
        value: mongodb
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: kicktotech
      - key: AUTH_SESSION_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        value: https://qzwtyldprahlpcuweoyo.supabase.co
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DB_URL
        sync: false
      - key: PAYMENT_UPI_ID
        value: 8007400498@ybl
      - key: PAYMENT_PAYEE_NAME
        value: KICK TO TECH
      - key: PAYMENT_AMOUNT
        value: "449"
      - key: PAYMENT_WHATSAPP_NUMBER
        value: "918007400498"
      - key: PAYMENT_NOTE
        value: KICK TO TECH internship payment
      - key: HACKATHON_PAYMENT_AMOUNT
        value: "99"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_TEMPLATE_ID
        value: "1"
      - key: BREVO_WELCOME_TEMPLATE_ID
        value: "1"
      - key: BREVO_HACKATHON_TEMPLATE_ID
        value: "5"
      - key: BREVO_SENDER_EMAIL
        value: internships@kicktotech.in
      - key: BREVO_SENDER_NAME
        value: KICK To TECH
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: NEXT_PUBLIC_RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
